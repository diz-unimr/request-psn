name: ttp

services:
  mysql:
    image: mysql:8.0.30
    container_name: mysql
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "true"
    volumes:
      - ./sqls/01_create_database_gpas.sql:/docker-entrypoint-initdb.d/01_create_database_gpas.sql
    command: --max_allowed_packet=20M --default-time-zone=Europe/Berlin

  gpas:
    image: mosaicgreifswald/gpas:2025.1.3
    depends_on:
      - mysql
    ports:
      - "8081:8080"

  test-data:
    profiles: [test]
    image: keinos/sqlite3:latest
    user: root
    volumes:
      - ../db.sqlite:/db/db.sqlite
      - ./sqls/00_init_app_database.sql:/db/init.sql:ro
    entrypoint: /bin/sh -c
    command:
      - "sqlite3 /db/db.sqlite 'VACUUM;' && sqlite3 /db/db.sqlite < /db/init.sql"
